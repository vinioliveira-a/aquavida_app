# Configuração do projeto Flutter: nome, versão, dependências, fontes e imagens.
name: aquavida
description: "AquaVida - aplicativo de acompanhamento de hidratação."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Chamadas HTTP para a API Java (só é usado quando AppConfig.usarMock = false)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonte Poppins (a mesma do Figma), incluída no app: funciona sem internet.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
